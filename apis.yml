apis:
- aid: seaweedfs:seaweedfs-grpc
  name: SeaweedFS gRPC API
  description: 'gRPC services exposed by SeaweedFS cluster components (Seaweed master, VolumeServer, SeaweedFiler, SeaweedS3, SeaweedIdentityAccessManagement, SeaweedMessaging broker and agent, mount, worker and plugin services), published as .proto files in the seaweedfs/seaweedfs repository. The host is self-deployed: each cluster serves these on its own master/volume/filer gRPC ports.'
  humanURL: https://github.com/seaweedfs/seaweedfs/wiki
  baseURL: http://{your-filer-host}:8888
  tags:
